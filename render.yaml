services:
  - type: web
    name: synk-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: SPEECHMATICS_BATCH_BASE_URL
        value: https://eu1.asr.api.speechmatics.com/v2
      - key: SPEECHMATICS_REALTIME_URL
        value: wss://eu.rt.speechmatics.com/v2
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.studio.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: meta-llama/Llama-3.3-70B-Instruct
