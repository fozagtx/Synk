services:
  - type: web
    name: synk-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
